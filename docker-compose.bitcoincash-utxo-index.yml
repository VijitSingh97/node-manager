services:
  dashboard:
    mem_limit: 2g
    cpus: 0.5
    environment:
      GOMEMLIMIT: 1600MiB
      BITCOINCASH_UTXO_INDEX_ENABLED: "1"
      BITCOINCASH_UTXO_INDEX_DIR: /utxo-index-bitcoincash
    volumes:
      - utxo_index_bitcoincash:/utxo-index-bitcoincash

volumes:
  utxo_index_bitcoincash:
