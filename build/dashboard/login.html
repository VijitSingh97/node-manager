<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Node Manager</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png?v=tower-1">
  <link rel="stylesheet" href="/static/dashboard.css">
  <link rel="stylesheet" href="/static/login.css">
  <script src="/static/theme-init.js"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <h1>Node Manager</h1>
    <p>Sign in to manage this node set.</p>
    {{if .Error}}<p class="login-error" role="alert">{{.Error}}</p>{{end}}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label>Username<input name="username" value="admin" autocomplete="username" maxlength="64" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" maxlength="1024" required autofocus></label>
      <label class="login-remember"><input type="checkbox" name="remember" value="1">Remember me for 30 days</label>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
